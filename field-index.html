<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VARZIN — Field Index Map</title>
    <style>
        :root {
            --bg-color: #060913;
            --card-bg: #0f172a;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.15);
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: "Fira Code", "Courier New", Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            line-height: 1.6;
            background-image: radial-gradient(circle at 50% -20%, rgba(56, 189, 248, 0.12), transparent 50%),
                              linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        .nav-bar {
            border-bottom: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 100;
        }

        .nav-container {
            max-width: 1200px; margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem;
        }

        .brand { font-size: 1.5rem; font-weight: 800; letter-spacing: 0.15em; color: #fff; font-family: var(--font-mono); }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; }
        .nav-links a { color: var(--text-dim); font-size: 0.9rem; text-transform: uppercase; }
        .nav-links a:hover, .nav-links a.active { color: var(--text-main); }
        .btn-contact { background: rgba(56, 189, 248, 0.15); border: 1px solid var(--primary); padding: 0.4rem 1rem; border-radius: 6px; }

        .container {
            max-width: 1100px;
            margin: 4rem auto;
            padding: 0 2rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 1.5rem;
            font-family: var(--font-mono);
            background: linear-gradient(135deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: var(--text-dim);
            margin-bottom: 3rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
        }

        .formula-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1.5rem;
            font-family: var(--font-mono);
            font-size: 0.95rem;
            color: #38bdf8;
            margin: 1.5rem 0;
            text-align: center;
            letter-spacing: 0.05em;
        }

        .panel h3 {
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 1rem;
            font-family: var(--font-mono);
        }

        .panel p {
            color: var(--text-dim);
            font-size: 0.95rem;
        }

        .local-notice {
            background: rgba(245, 158, 11, 0.05);
            border: 1px solid rgba(245, 158, 11, 0.15);
            padding: 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 2.5rem;
        }

            border-top: 1px solid var(--border-color);
