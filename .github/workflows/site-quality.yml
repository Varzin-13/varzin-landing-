name: Site quality

on:
  pull_request:
    paths:
      - "**/*.html"
      - "README.md"
      - "VARZIN_preprint_v2.md"
      - "VPE001A_protocol_design.md"
      - "CITATION.cff"
      - "assets/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "seo-meta.config.json"
      - "inject-seo-meta.js"
      - "sitemap.xml"
      - "robots.txt"
      - "research-outputs.json"
      - "publications/**"
      - "main.py"
      - "requirements.txt"
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "README.md"
      - "VARZIN_preprint_v2.md"
      - "VPE001A_protocol_design.md"
      - "CITATION.cff"
      - "assets/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "seo-meta.config.json"
      - "inject-seo-meta.js"
      - "sitemap.xml"
      - "robots.txt"
      - "research-outputs.json"
      - "publications/**"
      - "main.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements.txt httpx

      - name: Verify SEO generators are idempotent
        run: |
          npm run site:generate
          git diff --exit-code

      - name: Static checks and production build
        run: |
          npm test
          python3 scripts/check_engine_api.py
          npm run build
          python3 scripts/check_site.py dist
          git diff --check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser, responsive, and accessibility matrix
        run: |
          python3 -m http.server 4173 -d dist >/tmp/varzin-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npm run test:browser

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
